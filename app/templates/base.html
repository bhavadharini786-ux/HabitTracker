<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Habit Tracker</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Navbar */
    nav {
      background: #2c3e50;
      padding: 15px;
      display: flex;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .active {
      border-bottom: 2px solid #1abc9c;
    }

    /* Page content */
    .container {
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- 🔝 Navbar (same on all pages) -->
  <nav>
    <a href="dashboard.html" id="dashboardLink">Dashboard</a>
    <a href="habits.html" id="habitsLink">Habits</a>
    <a href="profile.html" id="profileLink">Profile</a>
  </nav>

  <!-- 📄 Page Content -->
  <div class="container">
    <h1>Welcome to Habit Tracker</h1>
    <p>This is your base page.</p>
  </div>

  <!-- 🧠 Script to highlight active page -->
  <script>
    const path = window.location.pathname;

    if (path.includes("dashboard")) {
      document.getElementById("dashboardLink").classList.add("active");
    } 
    else if (path.includes("habits")) {
      document.getElementById("habitsLink").classList.add("active");
    } 
    else if (path.includes("profile")) {
      document.getElementById("profileLink").classList.add("active");
    }
  </script>

</body>
</html>
