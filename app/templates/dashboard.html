<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{background:#0d1117;color:#e6edf3;font-family:Arial,sans-serif;}
    .navbar{background:#161b22;padding:18px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;}
    .logo{font-size:24px;font-weight:bold;color:#58a6ff;}
    .nav-links a{text-decoration:none;color:white;margin-left:20px;font-weight:bold;}
    .nav-links a:hover{color:#58a6ff;}
    .container{max-width:1200px;margin:auto;padding:30px;}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px;}
    .card{background:#161b22;border:1px solid #30363d;border-radius:15px;padding:30px;text-align:center;}
    .card h2{font-size:42px;color:#58a6ff;}
    .card p{color:#8b949e;font-size:18px;}
    .footer{text-align:center;margin-top:40px;color:#8b949e;}
  </style>
</head>
<body>
<div class="navbar">
  <div class="logo">HabitFlow</div>
  <div class="nav-links">
    <a href="/dashboard">Dashboard</a>
    <a href="/habits">Habits</a>
    <a href="/weekly">Weekly</a>
    <a href="/analytics">Analytics</a>
    <a href="/logout">Logout</a>
  </div>
</div>
<div class="container">
  <h1>📊 Dashboard</h1>
  <div class="stats">
    <div class="card"><h2 id="total">0</h2><p>Total Habits</p></div>
    <div class="card"><h2 id="completed">0</h2><p>Completed Today</p></div>
    <div class="card"><h2 id="rate">0%</h2><p>Completion Rate</p></div>
    <div class="card"><h2 id="streak">0</h2><p>🔥 Current Streak</p></div>
    <div class="card"><h2 id="score">0/0</h2><p>🏆 Score</p></div>
    <div class="card"><h2 id="remaining">0</h2><p>⏳ Remaining Habits</p></div>
  </div>
  <canvas id="trendChart"></canvas>
  <div class="footer">Stay consistent 🚀</div>
</div>
<script>
async function loadDashboard(){
  try {
    const dashRes = await fetch("/api/dashboard", {
      headers: {"Authorization":"Bearer "+localStorage.getItem("access_token")}
    });
    const dashData = await dashRes.json();

    // Fill cards
    document.getElementById("total").innerText = dashData.habits.length;
    document.getElementById("completed").innerText = dashData.today_count;
    document.getElementById("rate").innerText = dashData.completion_percent+"%";
    document.getElementById("streak").innerText = dashData.streak;
    document.getElementById("score").innerText = dashData.score;
    document.getElementById("remaining").innerText = dashData.remaining;

    // Weekly trend chart from analytics
    const analyticsRes = await fetch("/api/analytics", {
      headers: {"Authorization":"Bearer "+localStorage.getItem("access_token")}
    });
    const analyticsData = await analyticsRes.json();

    new Chart(document.getElementById("trendChart"),{
      type:'bar',
      data:{
        labels:analyticsData.weekly_labels,
        datasets:[{
          label:'Habits Completed',
          data:analyticsData.weekly_trend,
          backgroundColor:'#58a6ff'
        }]
      },
      options:{
        responsive:true,
        plugins:{
          title:{
            display:true,
            text:"Daily Habit Completion", // ✅ Graph title
            color:"white",
            font:{size:18}
          },
          legend:{labels:{color:"white"}}
        },
        scales:{
          x:{
            title:{display:true,text:"Day of the Week",color:"white"}, // ✅ X-axis label
            ticks:{color:"white"},
            grid:{color:"#30363d"}
          },
          y:{
            title:{display:true,text:"Habits Completed",color:"white"}, // ✅ Y-axis label
            beginAtZero:true,
            ticks:{color:"white",stepSize:1}, // increments of 1
            grid:{color:"#30363d"}
          }
        }
      }
    });
  } catch(err){
    document.querySelector(".container").innerHTML="<p style='color:red;text-align:center;'>Error loading dashboard. Please login again.</p>";
    console.error(err);
  }
}
loadDashboard();
</script>
</body>
</html>
