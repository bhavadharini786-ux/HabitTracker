<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Habit Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0d1117;
            color: #e6edf3;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        /* ================= CREATE FORM ================= */
        .form-box {
            background: #161b22;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
        }

        input {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
        }

        button {
            padding: 10px 15px;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        /* ================= TABLE ================= */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #161b22;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #30363d;
            text-align: center;
        }

        th {
            background: #21262d;
        }

        /* checkbox style */
        input[type="checkbox"] {
            transform: scale(1.3);
            cursor: pointer;
        }

        .status-done {
            color: #2ea043;
            font-weight: bold;
        }

        .status-pending {
            color: #f85149;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>📅 Habit Dashboard</h1>

    <!-- ================= CREATE HABIT ================= -->
    <div class="form-box">

        <h3>Create Habit</h3>

        <form method="POST" action="/habit/create">

            <input type="text" name="name" placeholder="Habit Name" required>
            <input type="text" name="time" placeholder="Time (e.g. 6:00 AM)" required>

            <button type="submit">+ Add Habit</button>

        </form>
    </div>

    <!-- ================= TABLE ================= -->
    <table>

        <tr>
            <th>Habit Name</th>
            <th>Date</th>
            <th>Status</th>
        </tr>

        {% for habit in habits %}

        <tr>
            <td>{{ habit.name }}</td>

            <td>{{ today }}</td>

            <td>

                <form method="POST" action="/habit/toggle/{{ habit._id }}">

                    {% if habit._id|string in completed_ids %}
                        <input type="checkbox" checked onchange="this.form.submit()">
                        <span class="status-done">Done</span>
                    {% else %}
                        <input type="checkbox" onchange="this.form.submit()">
                        <span class="status-pending">Not Done</span>
                    {% endif %}

                </form>

            </td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
