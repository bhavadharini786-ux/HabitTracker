<!DOCTYPE html>
<html>
<head>
    <title>Analytics Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .chart-container {
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .heatmap {
            display: grid;
            grid-template-columns: repeat(10, 20px);
            gap: 5px;
            margin-top: 20px;
            justify-content: center;
        }

        .cell {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        .level-0 { background: #ebedf0; }
        .level-1 { background: #c6e48b; }
        .level-2 { background: #7bc96f; }
        .level-3 { background: #196127; }

        .habit-list {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>📊 Analytics Dashboard</h1>

<!-- 🔥 Stats -->
<div class="cards">
    <div class="card">
        <h3>🔥 Streak</h3>
        <h2 id="streak">-</h2>
    </div>

    <div class="card">
        <h3>📈 Completion Rate</h3>
        <h2 id="rate">-</h2>
    </div>

    <div class="card">
        <h3>🏆 Top Habit</h3>
        <h2 id="topHabit">-</h2>
    </div>

    <div class="card">
        <h3>❌ Missed Days</h3>
        <h2 id="missed">-</h2>
    </div>
</div>

<!-- 📊 Weekly Chart -->
<div class="chart-container">
    <h3>📅 Weekly Activity</h3>
    <canvas id="weeklyChart"></canvas>
</div>

<!-- 🏆 Habit Leaderboard -->
<div class="habit-list">
    <h3>🏆 Habit Performance</h3>
    <ul id="habitStats"></ul>
</div>

<!-- 🟩 Heatmap -->
<div class="chart-container">
    <h3>🟩 Last 30 Days Activity</h3>
    <div id="heatmap" class="heatmap"></div>
</div>

<script>
async function loadAnalytics() {
    const res = await fetch("/api/analytics", {
        credentials: "same-origin"
    });

    const data = await res.json();

    // ✅ Cards (updated keys)
    document.getElementById("streak").innerText = data.streak + " days";
    document.getElementById("rate").innerText = data.completion_rate + "%";
    document.getElementById("topHabit").innerText = data.top_habit || "N/A";
    document.getElementById("missed").innerText = data.missed_days;

    // ✅ Weekly Chart (dynamic labels)
    const ctx = document.getElementById("weeklyChart").getContext("2d");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: data.weekly_labels,
            datasets: [{
                label: "Habits Completed",
                data: data.weekly_trend,
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { precision: 0 }
                }
            }
        }
    });

    // ✅ Habit leaderboard
    const list = document.getElementById("habitStats");
    list.innerHTML = "";

    data.habit_stats.forEach(habit => {
        const li = document.createElement("li");
        li.innerText = `${habit.name} → ${habit.count}`;
        list.appendChild(li);
    });

    // ✅ Heatmap
    const heatmap = document.getElementById("heatmap");
    heatmap.innerHTML = "";

    data.heatmap.forEach(day => {
        const cell = document.createElement("div");
        cell.className = "cell level-" + day.intensity;
        cell.title = `${day.date} → ${day.count}`;
        heatmap.appendChild(cell);
    });
}

loadAnalytics();
</script>

</body>
</html>
