<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;}
    .navbar{width:100%;background:#161b22;border-bottom:1px solid #30363d;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;}
    .logo{font-size:22px;font-weight:bold;color:#58a6ff;}
    .nav-links{display:flex;gap:15px;}
    .nav-links a{text-decoration:none;color:white;padding:10px 15px;border-radius:8px;transition:0.3s;}
    .nav-links a:hover{background:#21262d;}
    .logout-btn{background:#da3633;}
    .logout-btn:hover{background:#f85149;}
    .container{width:95%;max-width:1400px;margin:auto;padding:30px 0;}
    .page-title{text-align:center;margin-bottom:30px;font-size:38px;}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px;}
    .card{background:#161b22;padding:25px;border-radius:16px;border:1px solid #30363d;transition:0.3s;}
    .card:hover{transform:translateY(-5px);border-color:#58a6ff;}
    .card h3{color:#8b949e;margin-bottom:15px;}
    .card .value{font-size:42px;font-weight:bold;color:#58a6ff;}
    .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px;}
    .chart-box{background:#161b22;padding:20px;border-radius:16px;border:1px solid #30363d;}
    .chart-box h2{margin-bottom:20px;}
    canvas{width:100%!important;height:320px!important;}
    .heatmap-box{background:#161b22;padding:25px;border-radius:16px;border:1px solid #30363d;}
    .heatmap-title{margin-bottom:20px;}
    .heatmap{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;}
    .heat-cell{width:100%;aspect-ratio:1/1;border-radius:6px;}
    .lvl0{background:#161b22;border:1px solid #30363d;}
    .lvl1{background:#0e4429;}
    .lvl2{background:#006d32;}
    .lvl3{background:#26a641;}
    @media(max-width:900px){.chart-grid{grid-template-columns:1fr}.nav-links{flex-wrap:wrap}.page-title{font-size:28px}}
  </style>
</head>
<body>
<div class="navbar">
  <div class="logo">Habit Tracker</div>
  <div class="nav-links">
    <a href="/dashboard">Dashboard</a>
    <a href="/habits">Habits</a>
    <a href="/weekly">Weekly</a>
    <a href="/analytics">Analytics</a>
    <a href="/logout" class="logout-btn">Logout</a>
  </div>
</div>
<div class="container">
  <h1 class="page-title">📊 Advanced Analytics</h1>
  <div class="stats-grid">
    <div class="card"><h3>Completion Rate</h3><div class="value" id="completionRate">0%</div></div>
    <div class="card"><h3>Current Streak</h3><div class="value" id="streak">0</div></div>
    <div class="card"><h3>Top Habit</h3><div class="value" id="topHabit">-</div></div>
    <div class="card"><h3>Missed Days</h3><div class="value" id="missedDays">0</div></div>
  </div>
  <div class="chart-grid">
    <div class="chart-box"><h2>📈 Weekly Progress</h2><canvas id="weeklyChart"></canvas></div>
    <div class="chart-box"><h2>🏆 Habit Performance</h2><canvas id="habitChart"></canvas></div>
  </div>
  <div class="heatmap-box">
    <h2 class="heatmap-title">🔥 30-Day Activity Heatmap</h2>
    <div class="heatmap" id="heatmap"></div>
  </div>
</div>
<script>
async function loadAnalytics(){
  try {
    const response = await fetch("/api/analytics", {
      headers: { "Authorization": "Bearer " + localStorage.getItem("access_token") }
    });
    if(!response.ok) throw new Error("Failed to load analytics");
    const data = await response.json();

    // Stats
    document.getElementById("completionRate").innerText = data.completion_rate + "%";
    document.getElementById("streak").innerText = data.streak + " 🔥";
    document.getElementById("topHabit").innerText = data.top_habit || "-";
    document.getElementById("missedDays").innerText = data.missed_days;

    // Weekly Progress Chart
    new Chart(document.getElementById("weeklyChart"), {
      type: "line",
      data: {
        labels: data.weekly_labels,
        datasets: [{
          label: "Completed Habits",
          data: data.weekly_trend,
          borderColor: "#58a6ff",
          backgroundColor: "rgba(88,166,255,0.2)",
          tension:0.4,
          fill:true
        }]
      },
      options:{
        responsive:true,
        plugins:{legend:{labels:{color:"white"}}},
        scales:{
          x:{
            title:{display:true,text:"Day of the Week",color:"white"},
            ticks:{color:"white"},
            grid:{color:"#30363d"}
          },
          y:{
            title:{display:true,text:"Habits Completed",color:"white"},
            beginAtZero:true,
            ticks:{color:"white",stepSize:1},
            grid:{color:"#30363d"}
          }
        }
      }
    });

    // Habit Performance Chart
    new Chart(document.getElementById("habitChart"), {
      type: "bar",
      data: {
        labels: data.habit_stats.map(h => h.name),
        datasets: [{
          label:"Completions",
          data: data.habit_stats.map(h => h.count),
          backgroundColor:["#58a6ff","#2ea043","#db6d28","#8957e5","#f85149"]
        }]
      },
      options:{
        responsive:true,
        plugins:{legend:{labels:{color:"white"}}},
        scales:{
          x:{
            title:{display:true,text:"Habit Name",color:"white"},
            ticks:{color:"white"},
            grid:{color:"#30363d"}
          },
          y:{
            title:{display:true,text:"Completion Count",color:"white"},
            beginAtZero:true,
            ticks:{color:"white",stepSize:1},
            grid:{color:"#30363d"}
          }
        }
      }
    });

    // Heatmap
    const heatmap = document.getElementById("heatmap");
    heatmap.innerHTML = "";
    data.heatmap.forEach(day => {
      const div = document.createElement("div");
      div.className = `heat-cell lvl${day.intensity}`;
      div.title = `${day.date} → ${day.count} habits`;
      heatmap.appendChild(div);
    });
  } catch(err){
    document.querySelector(".container").innerHTML = "<p style='color:red;text-align:center;'>Error loading analytics. Please login again.</p>";
    console.error(err);
  }
}
loadAnalytics();
</script>
</body>
</html>
