<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{background:#0d1117;color:#e6edf3;font-family:Arial,sans-serif;}
    .navbar{background:#161b22;padding:18px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;}
    .logo{font-size:24px;font-weight:bold;color:#58a6ff;}
    .nav-links a{text-decoration:none;color:white;margin-left:20px;font-weight:bold;}
    .nav-links a:hover{color:#58a6ff;}
    .container{max-width:1200px;margin:auto;padding:30px;}
    h1{text-align:center;margin-bottom:30px;font-size:38px;}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px;}
    .card{background:#161b22;border:1px solid #30363d;border-radius:15px;padding:30px;text-align:center;}
    .card h2{font-size:42px;color:#58a6ff;}
    .card p{color:#8b949e;font-size:18px;}
    .heatmap-box{background:#161b22;border:1px solid #30363d;border-radius:15px;padding:25px;margin-bottom:30px;}
    .heatmap-title{margin-bottom:20px;text-align:center;}
    .heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
    .day-cell{width:100%;aspect-ratio:1/1;border-radius:6px;text-align:center;font-size:12px;line-height:1.2;padding:4px;}
    .lvl0{background:#161b22;border:1px solid #30363d;}
    .lvl1{background:#0e4429;}
    .lvl2{background:#006d32;}
    .lvl3{background:#26a641;}
    .today{border:2px solid #58a6ff;}
    .month-nav{text-align:center;margin-bottom:20px;}
    .month-nav button{padding:8px 15px;margin:0 10px;background:#30363d;color:white;border:none;border-radius:6px;cursor:pointer;}
    .month-nav button:hover{background:#484f58;}
    .footer{text-align:center;margin-top:40px;color:#8b949e;}
  </style>
</head>
<body>
<div class="navbar">
  <div class="logo">HabitFlow</div>
  <div class="nav-links">
    <a href="/dashboard">Dashboard</a>
    <a href="/habits">Habits</a>
    <a href="/weekly">Weekly</a>
    <a href="/analytics">Analytics</a>
    <a href="/monthly">Monthly</a>
    <a href="/logout">Logout</a>
  </div>
</div>
<div class="container">
  <h1>📅 Monthly Insights</h1>
  <div class="stats">
    <div class="card"><h2 id="monthName">June 2026</h2><p>📆 Current Month</p></div>
    <div class="card"><h2 id="completionRate">0%</h2><p>📊 Completion Rate</p></div>
    <div class="card"><h2 id="streak">0</h2><p>🔥 Longest Streak</p></div>
    <div class="card"><h2 id="total">0</h2><p>✅ Total Completions</p></div>
  </div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">⬅️ Previous</button>
    <button onclick="changeMonth(1)">Next ➡️</button>
  </div>
  <div class="heatmap-box">
    <h2 class="heatmap-title">🟩 Monthly Activity Heatmap</h2>
    <div class="heatmap" id="monthGrid"></div>
  </div>
  <div class="footer">Track your monthly progress 🚀</div>
</div>
<script>
let monthOffset = 0;

async function loadMonthly(){
  try {
    const response = await fetch("/api/monthly?monthOffset=" + monthOffset, {
      headers: { "Authorization": "Bearer " + localStorage.getItem("access_token") }
    });
    if(!response.ok) throw new Error("Failed to load monthly data");
    const data = await response.json();

    // Stats
    document.getElementById("monthName").innerText = data.month_name;
    document.getElementById("completionRate").innerText = data.completion_rate + "%";
    document.getElementById("streak").innerText = data.streak;
    document.getElementById("total").innerText = data.total_completions;

    // Heatmap
    const grid = document.getElementById("monthGrid");
    grid.innerHTML = "";
    const today = new Date().toISOString().split("T")[0];

    data.days.forEach(day => {
      let level = "lvl0";
      if(day.count >= 1 && day.count <= 2) level = "lvl1";
      else if(day.count >= 3 && day.count <= 5) level = "lvl2";
      else if(day.count > 5) level = "lvl3";

      const highlight = day.date === today ? "today" : "";
      grid.innerHTML += `
        <div class="day-cell ${level} ${highlight}" title="${day.date} → ${day.count} habits">
          ${new Date(day.date).getDate()}
        </div>
      `;
    });
  } catch(err){
    document.querySelector(".container").innerHTML = "<p style='color:red;text-align:center;'>Error loading monthly data. Please login again.</p>";
    console.error(err);
  }
}

function changeMonth(offset){
  monthOffset += offset;
  loadMonthly();
}

loadMonthly();
</script>
</body>
</html>
