<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Analytics</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0d1117;color:#e6edf3;font-family:Arial,sans-serif;}

        /* NAVBAR */
        .navbar{
            background:#161b22;
            padding:18px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid #30363d;
        }
        .logo{font-size:24px;font-weight:bold;color:#58a6ff;}
        .nav-links a{
            text-decoration:none;color:white;margin-left:20px;font-weight:bold;transition:0.3s;
        }
        .nav-links a:hover{color:#58a6ff;}

        /* MAIN */
        .container{max-width:1200px;margin:auto;padding:30px 20px;}
        h1{text-align:center;margin-bottom:30px;font-size:40px;}

        /* STATS */
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px;}
        .card{background:#161b22;border:1px solid #30363d;border-radius:15px;padding:30px;text-align:center;transition:0.3s;}
        .card:hover{transform:translateY(-5px);border-color:#58a6ff;}
        .card h2{font-size:42px;margin-bottom:10px;color:#58a6ff;}
        .card p{color:#8b949e;font-size:18px;}

        /* CHART */
        .chart-box{background:#161b22;border:1px solid #30363d;border-radius:15px;padding:30px;margin-bottom:30px;}
        .chart-box h2{margin-bottom:20px;}

        /* HEATMAP */
        .activity-section{background:#161b22;border:1px solid #30363d;border-radius:15px;padding:30px;}
        .activity-section h2{margin-bottom:20px;}
        .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
        .day-box{background:#21262d;padding:20px 10px;border-radius:10px;text-align:center;transition:0.3s;}
        .day-box:hover{transform:scale(1.05);}
        .count{font-size:30px;font-weight:bold;margin:10px 0;}
        .low{background:#1b4332;}
        .medium{background:#2d6a4f;}
        .high{background:#40916c;}
        .none{background:#21262d;}
        .today-highlight{border:2px solid #58a6ff;}

        /* FOOTER */
        .footer{text-align:center;margin-top:40px;color:#8b949e;}

        @media(max-width:800px){
            .grid{grid-template-columns:repeat(2,1fr);}
            .navbar{flex-direction:column;gap:15px;}
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">HabitFlow</div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/habits">Habits</a>
        <a href="/weekly">Weekly</a>
        <a href="/analytics">Analytics</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<!-- CONTENT -->
<div class="container">
    <h1>📅 Weekly Insights</h1>

    <!-- STATS -->
    <div class="stats">
        <div class="card"><h2 id="streak">0</h2><p>🔥 Current Streak</p></div>
        <div class="card"><h2 id="consistency">0%</h2><p>📊 Consistency</p></div>
        <div class="card"><h2 id="total">0</h2><p>✅ Weekly Completions</p></div>
    </div>

    <!-- GRAPH 1 -->
    <div class="chart-box">
        <h2>📈 Weekly Progress</h2>
        <canvas id="weeklyChart"></canvas>
    </div>

    <!-- GRAPH 2 -->
    <div class="chart-box">
        <h2>📊 Habit Performance</h2>
        <canvas id="habitPerformanceChart"></canvas>
    </div>

    <!-- HEATMAP -->
    <div class="activity-section">
        <h2>🟩 Weekly Activity Heatmap</h2>
        <div class="grid" id="weekGrid"></div>
    </div>

    <div class="footer">Build consistency one day at a time 🚀</div>
</div>

<!-- SCRIPT -->
<script>
async function loadWeekly(){
    try {
        const response = await fetch("/api/weekly", {
            headers: { "Authorization": "Bearer " + localStorage.getItem("access_token") }
        });
        if (!response.ok) throw new Error("Failed to load weekly data");
        const data = await response.json();

        // Stats
        document.getElementById("streak").innerText = data.streak || 0;
        document.getElementById("consistency").innerText = (data.consistency || 0) + "%";
        let total = 0;
        data.days.forEach(day => total += day.count);
        document.getElementById("total").innerText = total;

        // Weekly Progress Chart
        const labels = data.days.map(day => day.date);
        const values = data.days.map(day => day.count);
        new Chart(document.getElementById("weeklyChart"), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Completed Habits',
                    data: values,
                    borderColor: '#58a6ff',
                    backgroundColor: 'rgba(88,166,255,0.2)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 3
                }]
            },
            options: {
  responsive: true,
  plugins: { legend: { labels: { color: 'white' } } },
  scales: {
    x: {
      title: { display: true, text: "Day of the Week", color: "white" },
      ticks: { color: 'white' },
      grid: { color: '#30363d' }
    },
    y: {
      title: { display: true, text: "Habits Completed", color: "white" },
      beginAtZero: true,
      ticks: { color: 'white', stepSize: 1 },   // ✅ increments of 1
      grid: { color: '#30363d' }
    }
  }
}

 
         }  );

        // Habit Performance Chart (dummy example, replace with /api/analytics data)
        const habitNames = ["Drink Water","Exercise","Meditation","Read Book"];
        const habitCounts = [5,3,4,2];
        new Chart(document.getElementById("habitPerformanceChart"), {
            type: 'bar',
            data: {
                labels: habitNames,
                datasets: [{
                    label: 'Completion Count',
                    data: habitCounts,
                    backgroundColor: '#58a6ff'
                }]
            },
           options: {
  responsive: true,
  plugins: { legend: { labels: { color: 'white' } } },
  scales: {
    x: {
      title: { display: true, text: "Habit Name", color: "white" },
      ticks: { color: 'white' },
      grid: { color: '#30363d' }
    },
    y: {
      title: { display: true, text: "Completion Count", color: "white" },
      beginAtZero: true,
      ticks: { color: 'white', stepSize: 1 },   // ✅ increments of 1
      grid: { color: '#30363d' }
    }
  }
}

        });

        // Heatmap
        const grid = document.getElementById("weekGrid");
        grid.innerHTML = "";
        const today = new Date().toISOString().split("T")[0];
        data.days.forEach(day => {
            let level = "none";
            if(day.count >= 1 && day.count <= 2) level = "low";
            else if(day.count >= 3 && day.count <= 5) level = "medium";
            else if(day.count > 5) level = "high";
            const highlight = day.date === today ? "today-highlight" : "";
            grid.innerHTML += `
                <div class="day-box ${level} ${highlight}">
                    <h3>${day.date}</h3>
                    <div class="count">${day.count}</div>
                    <p>Habits Done</p>
                </div>`;
        });

    } catch (err) {
        document.querySelector(".container").innerHTML =
            "<p style='color:red;text-align:center;'>Error loading weekly data. Please login again.</p>";
        console.error(err);
    }
}
loadWeekly();
</script>
</body>
</html>
