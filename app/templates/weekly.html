<!DOCTYPE html>
<html>
<head>
    <title>Weekly Heatmap</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 50px);
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .cell {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .cell:hover {
            transform: scale(1.1);
        }

        /* GitHub-style colors */
        .level-0 { background: #ebedf0; }
        .level-1 { background: #c6e48b; }
        .level-2 { background: #7bc96f; }
        .level-3 { background: #196127; }

        .labels {
            display: grid;
            grid-template-columns: repeat(7, 50px);
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            font-size: 12px;
        }

        .stats {
            margin-top: 30px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<h1>📅 Weekly Heatmap</h1>

<div id="grid" class="grid"></div>

<div class="labels">
    <div>Mon</div><div>Tue</div><div>Wed</div>
    <div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
</div>

<div id="stats" class="stats"></div>

<script>
async function loadWeekly() {
    try {
        const res = await fetch("/api/weekly", {
            credentials: "same-origin"
        });

        if (!res.ok) throw new Error("API error");

        const data = await res.json();
        const days = data.days;

        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        days.forEach(day => {
            const cell = document.createElement("div");

            // 👇 now comes from backend
            const level = day.intensity;

            cell.className = "cell level-" + level;
            cell.title = `${day.date} → ${day.count} habits`;

            // optional click interaction
            cell.onclick = () => {
                alert(`${day.date}\nCompleted: ${day.count}`);
            };

            grid.appendChild(cell);
        });

        // stats
        document.getElementById("stats").innerHTML = `
            🔥 Streak: ${data.streak} days <br>
            📊 Consistency: ${data.consistency}%
        `;

    } catch (err) {
        console.error(err);
        document.getElementById("grid").innerHTML =
            "<p style='color:red'>Failed to load data</p>";
    }
}

loadWeekly();
</script>

</body>
</html>
